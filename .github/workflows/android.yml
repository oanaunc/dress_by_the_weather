name: Android checks
on:
  push:
    branches: [main]
    paths: ['Android/**', 'App/Assets.xcassets/**', 'App/Resources/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['Android/**', 'App/Assets.xcassets/**', 'App/Resources/**', '.github/workflows/android.yml']
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # The official Ubuntu runner already includes the Android SDK and licenses.
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
      - uses: gradle/actions/setup-gradle@v6
      - working-directory: Android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
